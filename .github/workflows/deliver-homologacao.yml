name: Entregar homologacao validada

on:
  push:
    branches: [homologacao]
    paths: ['.github/workflows/deliver-homologacao.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bistro-homologacao-publish
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/homologacao'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run publicar:homologacao -- --check
      - run: npx expo lint
      - run: npx tsc --noEmit
      - run: node --test tests/*.test.cjs tests/*.test.mjs

  portals:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Publicar somente Worker de homologacao preservando variaveis
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          node --input-type=module - <<'NODE'
          for (const name of ['CLOUDFLARE_API_TOKEN', 'CLOUDFLARE_ACCOUNT_ID']) {
            if (!process.env[name]?.trim()) throw new Error('Credencial ausente: ' + name);
          }
          NODE
          npx --yes wrangler@4 deploy --keep-vars --config server/cloudflare/wrangler.homologacao.jsonc
      - name: Conferir saude do servidor
        run: |
          node --input-type=module - <<'NODE'
          const response = await fetch('https://seabra-cardapio-homologacao.wooxonly-comandas.workers.dev/health');
          if (!response.ok || (await response.json()).ok !== true) throw new Error('Falha na saude da homologacao');
          NODE

  apk:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      APP_VARIANT: homologacao
      EXPO_PUBLIC_API_BASE_URL: https://seabra-cardapio-homologacao.wooxonly-comandas.workers.dev
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_LOCAL_BUILD_WORKINGDIR: ${{ github.workspace }}/../bistro-eas-local
      GRADLE_OPTS: -Dorg.gradle.workers.max=2 -Dorg.gradle.daemon=false
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
      - name: Conferir credencial Expo antes de preparar ferramentas
        run: node -e "if (!process.env.EXPO_TOKEN?.trim()) throw new Error('EXPO_TOKEN ausente')"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Conferir conta Expo sem exibir credenciais
        run: |
          node -e "if (!process.env.EXPO_TOKEN?.trim()) throw new Error('EXPO_TOKEN ausente')"
          npx --yes eas-cli@latest whoami
      - name: Gerar APK assinado localmente no runner
        run: |
          mkdir -p artifacts
          npx --yes eas-cli@latest build --local --platform android --profile homologacao --non-interactive --output artifacts/BistroHub-Homologacao.apk
      - name: Verificar assinatura e pacote exclusivo de homologacao
        run: |
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify artifacts/BistroHub-Homologacao.apk
          "$BUILD_TOOLS/aapt" dump badging artifacts/BistroHub-Homologacao.apk > artifacts/apk-info.txt
          node --input-type=module - <<'NODE'
          import { readFileSync } from 'node:fs';
          const info = readFileSync('artifacts/apk-info.txt', 'utf8');
          if (!info.includes("package: name='com.wooxonly.comandadigitalprint.homologacao'")) throw new Error('Pacote incorreto');
          NODE
          sha256sum artifacts/BistroHub-Homologacao.apk > artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: BistroHub-Homologacao-${{ github.sha }}
          path: artifacts/
          retention-days: 30
  release:
    needs: [portals, apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: BistroHub-Homologacao-${{ github.sha }}
          path: artifacts/
      - name: Disponibilizar APK para testes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="homologacao-${GITHUB_SHA:0:12}"
          cat > "$RUNNER_TEMP/release-notes.md" <<NOTES
          App e portais de homologação no commit $GITHUB_SHA.

          Administrativo: https://seabra-cardapio-homologacao.wooxonly-comandas.workers.dev/admin
          Portal do cliente: https://seabra-cardapio-homologacao.wooxonly-comandas.workers.dev/gestor

          APK assinado, com pacote exclusivo de homologação. Os testes automatizados não substituem a validação física do tablet e da impressora. A integração futura do fluxo de encomendas com cozinha/caixa permanece adiada.
          NOTES
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" --title "BistroHub Homologação ${GITHUB_SHA:0:7}" --notes-file "$RUNNER_TEMP/release-notes.md" artifacts/BistroHub-Homologacao.apk artifacts/SHA256SUMS.txt
