name: Validate app and server

on:
  push:
    branches: [main, homologacao]
  pull_request:
    branches: [main, homologacao]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx expo lint
      - run: npx tsc --noEmit
      - run: node --test tests/*.test.cjs tests/*.test.mjs
